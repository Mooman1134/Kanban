<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Piece Card Prices</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">One Piece Card Prices</h1>
    <input type="text" id="search" class="form-control mb-3" placeholder="Search card...">
    <table class="table table-striped" id="card-table">
      <thead>
        <tr><th>Name</th><th>Set</th><th>Price</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <canvas id="history-chart" height="100"></canvas>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
